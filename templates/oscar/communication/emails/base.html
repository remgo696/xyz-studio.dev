<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        /* Estilos inline para clientes de correo antiguos */
        body { font-family: 'Courier New', Courier, monospace; background-color: #f4f4f4; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; border: 1px solid #e0e0e0; }
        .header { background-color: #36454F; color: #ffffff; padding: 30px; text-align: center; }
        .header h1 { margin: 0; font-family: Arial, sans-serif; letter-spacing: 2px; font-size: 24px; text-transform: uppercase; }
        .content { padding: 40px 30px; line-height: 1.6; font-family: Arial, sans-serif; font-size: 14px; }
        .footer { background-color: #f9f9f9; padding: 20px; text-align: center; font-size: 10px; color: #888; border-top: 1px solid #eee; font-family: 'Courier New', monospace; }
        .btn { display: inline-block; background-color: #36454F; color: #ffffff; text-decoration: none; padding: 12px 25px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; margin-top: 20px; }
        .highlight { color: #8A9A5B; font-weight: bold; }
        .divider { height: 1px; background-color: #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XYZ STUDIO</h1>
            <p style="font-size: 10px; margin-top: 5px; opacity: 0.7;">MANUFACTURA DIGITAL & DISEÑO</p>
        </div>

        <div class="content">
            {% block body %}
            {% endblock %}
        </div>

        <div class="footer">
            <p>
                <strong>XYZ STUDIO (David Díaz Malca)</strong><br>
                RUC: 10726400747<br>
                Lima, Perú
            </p>
            <p>
                Este mensaje es confidencial y para uso exclusivo del destinatario.<br>
                <a href="{{ homepage_url }}" style="color: #333; text-decoration: none;">www.xyzstudio.dev</a>
            </p>
        </div>
    </div>
</body>
</html>
