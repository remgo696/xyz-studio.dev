{% load i18n %}
{% load display_tags %}

<a href="{% url 'customer:profile-view' %}" class="block px-4 py-3 text-sm font-squada uppercase tracking-wide text-xyz-charcoal hover:bg-xyz-offwhite border-l-4 border-transparent hover:border-xyz-sage transition-all {% if active_tab == 'profile' %}bg-xyz-offwhite border-xyz-sage font-bold{% endif %}">

    {% trans "Profile" %}
</a>

</a>

</a>
